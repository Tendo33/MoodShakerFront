services:
  # Web 应用服务
  moodshaker-web:
    image: simonsun3/moodshaker:latest
    container_name: moodshaker-web
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      # 基础配置
      - NODE_ENV=production
      - PORT=3000
      
      # 数据库连接 (直接连接到 db 服务)
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-moodshaker}?schema=public
      
      # OpenAI 配置
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.siliconflow.cn/v1/}
      - OPENAI_MODEL=${OPENAI_MODEL:-deepseek-v3}
      
      # 图像生成配置
      - IMAGE_API_URL=${IMAGE_API_URL:-https://api.siliconflow.cn/v1/images/generations}
      - IMAGE_API_KEY=${IMAGE_API_KEY}
      - IMAGE_MODEL=${IMAGE_MODEL:-Qwen/Qwen-Image}

      # Cloudflare R2 对象存储 (生成图片的存放位置)
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET=${R2_BUCKET:-moodshaker-images}
      - R2_PUBLIC_BASE_URL=${R2_PUBLIC_BASE_URL}

      # 反向代理层数。容器跑在 Caddy/Nginx 后面时为 1。
      # 用于从 x-forwarded-for 右侧数出可信客户端 IP，防止伪造首跳绕过限流。
      - TRUSTED_PROXY_HOPS=${TRUSTED_PROXY_HOPS:-1}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # 探 /api/health，不是 /。/ 返回的是静态外壳，数据库挂掉也是 200，
      # 于是一个连不上数据库的容器会一直报 healthy 并继续接流量。
      #
      # --spider 只看状态码，正好够用：端点在依赖不可用时返回 503。
      #
      # timeout 必须大于端点自己的 CHECK_TIMEOUT_MS（12s），否则探测会在
      # 端点正要给出正确答案时先放弃。改这里就要一起看 app/api/health/route.ts。
      #
      # retries 和 start_period 才是真正兜住数据库冷启动的东西，不是 timeout。
      # Neon 空闲后会挂起，Prisma 默认约 5s 放弃连接，所以唤醒期间出现单次 503
      # 属于预期；实测同一实例既出现过 5036ms 失败也出现过 9956ms 成功。
      # 把 retries 降成 1 会让容器在冷启动时被判定不健康。
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - moodshaker-network

  # PostgreSQL 数据库服务
  db:
    image: postgres:15.4-alpine
    container_name: moodshaker-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-moodshaker}
      POSTGRES_INITDB_ARGS: "-E UTF8"
      TZ: Asia/Shanghai
    # 生产环境建议：不暴露数据库端口到宿主机，仅通过内部网络访问
    # 如需外部访问（如备份、调试），取消下面两行注释
    # ports:
    #   - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-moodshaker}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - moodshaker-network

networks:
  moodshaker-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
