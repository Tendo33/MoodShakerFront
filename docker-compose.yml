# App + Postgres. Settings come from .env (see .env.example).
# Production pulls the image CI pushes to GHCR; the server never builds:
#   docker compose pull && docker compose up -d
# Pin or roll back with IMAGE_TAG=sha-xxxxxxx (or 1.0.0).
# To run the current checkout instead, layer the build override:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
x-logging: &logging
  options: { max-size: "10m", max-file: "3" }

services:
  web:
    image: ghcr.io/tendo33/moodshaker:${IMAGE_TAG:-latest}
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-moodshaker}
      # One reverse proxy (Caddy/Nginx) in front; see lib/http.ts getClientIp.
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      # The site sits behind Cloudflare, which carries the visitor's address in
      # cf-connecting-ip. Set to false when it does not, or anyone can forge it.
      TRUST_CLOUDFLARE: ${TRUST_CLOUDFLARE:-true}
    ports:
      - "${HOST_PORT:-3000}:3000"
    depends_on: [db]
    restart: unless-stopped
    logging: *logging

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-moodshaker}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    logging: *logging

volumes:
  postgres_data:
