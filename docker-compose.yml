# App + Postgres. Settings come from .env (see .env.example).
# The image is the one release.yml publishes on a v* tag; to run the current
# checkout instead: docker build -t simonsun3/moodshaker:latest .
x-logging: &logging
  options: { max-size: "10m", max-file: "3" }

services:
  web:
    image: simonsun3/moodshaker:latest
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-moodshaker}
      # One reverse proxy (Caddy/Nginx) in front; see lib/http.ts getClientIp.
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
    ports:
      - "${HOST_PORT:-3000}:3000"
    depends_on: [db]
    restart: unless-stopped
    logging: *logging

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-moodshaker}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    logging: *logging

volumes:
  postgres_data:
